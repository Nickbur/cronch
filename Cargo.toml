[package]
name = "cronch"
version = "0.1.0"
edition = "2024"
description = "A cross-platform (Windows & macOS) system-tray task scheduler."
authors = ["burakov"]
homepage = "https://burakov.net"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["scheduler", "cron", "tray", "automation", "tasks"]
categories = ["command-line-utilities"]

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"

[dependencies]
anyhow = "1.0.104"
auto-launch = "0.6.0"
chrono = { version = "0.4.45", features = ["serde"] }
cron = "0.17.0"
directories = "6.0.0"
env_logger = "0.11.11"
image = "0.25.10"
log = "0.4.34"
rfd = "0.17.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shell-words = "1.1.1"
single-instance = "0.3.3"
slint = "1.17.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "time", "sync"] }
toml = "1.1.5"
tray-icon = "0.24.2"
uuid = { version = "1.26.0", features = ["v4", "serde"] }

[build-dependencies]
slint-build = "1.17.1"
