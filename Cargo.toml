[package]
name = "cronch"
version = "1.0.0"
edition = "2024"
description = "A cross-platform (Windows & macOS) system-tray task scheduler."
authors = ["burakov"]
homepage = "https://burakov.net"
repository = "https://github.com/Nickbur/cronch"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["scheduler", "cron", "tray", "automation", "tasks"]
categories = ["gui"]

# macOS .app packaging via `cargo bundle` (see BUILD.md). Points at the bundled
# brand icon so the asset is actually used rather than sitting dead in the repo.
[package.metadata.bundle]
name = "Cronch"
identifier = "net.burakov.Cronch"
icon = ["assets/icon.icns"]

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"

[dependencies]
anyhow = "1.0.104"
auto-launch = "0.6.0"
chrono = { version = "0.4.45", features = ["serde"] }
croner = "4.0.1"
directories = "6.0.0"
env_logger = "0.11.11"
image = "0.25.10"
log = "0.4.34"
rfd = "0.17.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shell-words = "1.1.1"
single-instance = "0.3.3"
slint = "1.17.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util"] }
tray-icon = "0.24.2"
uuid = { version = "1.26.0", features = ["v4", "serde"] }

[build-dependencies]
slint-build = "1.17.1"

# Windows-only: embeds assets/icon.ico into the .exe (Explorer/taskbar icon).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Unix-only: kill a job's whole process group on timeout.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# macOS-only: answers the "reopen" Apple event (Dock icon, opening the app again).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
